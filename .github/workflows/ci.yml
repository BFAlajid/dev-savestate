# CI: build, typecheck, and test every workspace on every push to main and PR.
# Matrix covers Linux/macOS/Windows x Node 20 and 22 to catch platform regressions early.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      # CLI tests run on every OS. The VS Code extension tests launch an
      # Electron instance via @vscode/test-electron and need a display — we
      # run them on Linux only under xvfb. On macOS/Windows runners we skip
      # the extension package and only test the CLI. See packages/vscode
      # test harness for details.
      - name: Test (non-Linux — CLI only)
        if: runner.os != 'Linux'
        run: npm run test --workspace=packages/cli --if-present
      - name: Test (Linux — all workspaces, xvfb for VS Code)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test --workspaces --if-present
